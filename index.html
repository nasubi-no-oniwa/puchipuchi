<style>
:root{--bg:#e9eef2;--ink:#1d2430;--sub:#5d6775;--accent:#2a8fd6;--red:#d8352a;--ok:#1aa34a;--warn:#d9a400;--card:#fbfdff}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#tap{position:fixed;inset:0;z-index:2;touch-action:none}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);text-align:center;z-index:4;pointer-events:none}
#hudTitle{font-size:12px;font-weight:900;color:#3d5168}
#hudN{font-size:56px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05;text-shadow:0 2px 0 #fff9;display:inline-block}
#hudN small{font-size:20px;margin-left:2px}
#hudIv{font-size:14px;font-weight:900;color:#3d5168;font-variant-numeric:tabular-nums}
#hudBest{font-size:11px;color:#3d5168cc;font-variant-numeric:tabular-nums}
#gauge{position:relative;margin:8px auto 0;width:min(70vw,300px);height:16px;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(90deg,#f6c3bd 0%,#fff1b3 25%,#c9f0d3 42%,#c9f0d3 58%,#fff1b3 75%,#f6c3bd 100%);box-shadow:0 2px 0 #0003}
#gauge:before{content:'';position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink)}
#gMark{position:absolute;top:-7px;width:8px;height:24px;margin-left:-4px;border-radius:4px;background:var(--ink);left:50%;transition:left .06s}
#gauge span{position:absolute;top:18px;font-size:10px;font-weight:900;color:#3d5168}
#gL{left:0}#gR{right:0}
#hudErr{font-size:22px;font-weight:900;margin-top:12px;font-variant-numeric:tabular-nums;min-height:1.3em}
#hudErr.g{color:var(--ok)}#hudErr.y{color:var(--warn)}#hudErr.r{color:var(--red)}
#hudErr small{font-size:13px;margin-left:6px}
#beat{width:18px;height:18px;border-radius:50%;margin:6px auto 0;background:#3d516833;transition:background .05s}
#beat.on{background:var(--accent)}
#cap{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);text-align:center;z-index:4;pointer-events:none;font-size:20px;font-weight:900;color:var(--ink);text-shadow:0 0 6px #fff,0 0 3px #fff;line-height:1.4}
#cap small{display:block;font-size:13px;font-weight:700}
#cap.pop{animation:pop .45s ease-out}
#big{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:58px;font-weight:900;color:#fff;text-shadow:0 4px 0 #0006,0 0 14px #0007;z-index:7;pointer-events:none;line-height:1.1;padding:0 10px}
#big small{display:block;font-size:20px;margin-top:6px}
#big.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
#prBar{pointer-events:none;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px}
#prBar .spdRow{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:420px}
#prBar .spdRow button{min-width:44px;padding:9px 6px;border-radius:10px;border:2px solid var(--ink);background:#fff;font:800 14px inherit;font-family:inherit;color:var(--ink)}
#prBar .spdRow button.on{background:var(--ink);color:#fff}
#prBar .row{pointer-events:auto;width:100%;max-width:420px}
#prBar .row button{padding:13px;border-radius:12px;border:none;font:800 16px inherit;font-family:inherit;background:var(--accent);color:#fff}
#prBar .row button.sub{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#1d243055;padding:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:18px;max-width:380px;width:100%;text-align:center;max-height:100%;overflow:auto;box-shadow:0 8px 0 #0004}
.card h1{margin:0 0 6px;font-size:34px;line-height:1.2}
.card h1 em{font-style:normal;color:var(--accent)}
.card h1 small{display:block;font-size:13px;color:var(--sub);margin-top:2px;letter-spacing:.15em}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:8px 0;line-height:1.6;font-size:14px;color:var(--sub)}
.card p.warn{font-size:12px;color:#5b6f86}
.card button{display:block;width:100%;margin-top:9px;padding:13px;border:none;border-radius:12px;font-size:17px;font-weight:800;font-family:inherit;background:var(--accent);color:#fff;cursor:pointer}
.card button.sub{background:#e6ecf2;color:var(--ink);font-size:15px}
.card button.x{background:#000;color:#fff}
.card button:disabled{opacity:.45}
.card input{width:100%;font-size:16px;border-radius:10px;border:2px solid #ccd;padding:9px;font-family:inherit;margin-top:6px}
.row{display:flex;gap:8px}.row button{flex:1}
.spdL{font-size:13px;font-weight:900;color:var(--ink);margin-top:10px}
.spds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.card .spds button{margin:0;padding:9px 0;font-size:14px;background:#e6ecf2;color:var(--ink);border-radius:10px}
.card .spds button.on{background:var(--ink);color:#fff}
#langs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#langs button{width:auto;flex:none;padding:6px 10px;font-size:13px;margin:0;background:#eee;color:var(--ink)}
#langs button.on{background:var(--ink);color:#fff}
.bigNum{font-size:52px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.bigNum small{font-size:20px}
.ivl{font-size:15px;font-weight:900;color:#2f5f8a;font-variant-numeric:tabular-nums;margin-top:4px}
.mid{font-size:20px;font-weight:900;margin-top:6px}
.note{font-size:13px;min-height:1.3em}
.note.err{color:#d23}.note.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;margin:0;padding:9px;font-size:15px;background:#eee;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
table.rank{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rank td{padding:6px 3px;border-bottom:1px solid #eee;text-align:left}
table.rank td.r{color:var(--accent);font-weight:900;width:2.4em}
table.rank td.n{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rank td.c{text-align:right;font-weight:900}
table.rank tr.me td{background:#fff2c4}
#rankBox{max-height:56vh;overflow:auto}
#ogpT{position:fixed;left:4%;width:56%;top:12%;text-align:left;z-index:20;pointer-events:none;color:var(--ink);font-weight:900;text-shadow:0 0 10px #fff,0 0 4px #fff}
#ogpT b{display:block;font-size:100px;line-height:1.05}
#ogpT i{display:block;font-style:normal;font-size:34px;margin-top:14px;color:#1f6fae}
#ogpT s{display:block;text-decoration:none;font-size:30px;margin-top:26px}
</style>

<canvas id="c"></canvas>
<div id="tap" hidden></div>
<canvas id="fx"></canvas>
